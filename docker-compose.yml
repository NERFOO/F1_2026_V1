services:
  f1:
    build:
      context: ./F1
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlF1: ${CONNECTION_STRING}
      Admin__Email: ${ADMIN_EMAIL}
    networks:
      - public

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public

networks:
  public:

volumes:
  caddy_data:
  caddy_config:
